<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contact">
        <h1>Contact us</h1>
        <p class="intro">Send us a message and we'll get back to you.</p>

        <form id="contactForm">
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="How can we help?"></textarea>
            </div>

            <button type="submit" id="submitBtn">Send message</button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        const form = document.getElementById("contactForm");
        const statusBox = document.getElementById("status");
        const btn = document.getElementById("submitBtn");

        function show(text, type) {
            statusBox.textContent = text;
            statusBox.className = "status " + type;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form));
            btn.disabled = true;
            btn.textContent = "Sending...";
            statusBox.textContent = "";
            statusBox.className = "status";

            try {
                const res = await fetch("/api/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    show("Message sent. Your data was saved successfully.", "success");
                    form.reset();
                } else {
                    show("Could not save your message. Please try again.", "error");
                }
            } catch (err) {
                show("Network error. Check your connection and try again.", "error");
            }

            btn.disabled = false;
            btn.textContent = "Send message";
        });
    </script>
</body>

</html>
